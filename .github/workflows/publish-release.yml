name: Publish Installer Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: zsh -e -o pipefail {0}

concurrency:
  group: public-installer-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      dmg_name: ${{ steps.metadata.outputs.dmg_name }}
      dmg_sha256: ${{ steps.artifacts.outputs.dmg_sha256 }}
      appcast_sha256: ${{ steps.artifacts.outputs.appcast_sha256 }}

    steps:
      - name: Check out the tagged artifacts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and mirrored paths
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          SEMVER_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$GITHUB_REF_NAME" =~ $SEMVER_PATTERN ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH with no leading zeroes." >&2
            exit 1
          fi

          if [[ ! "$APPLE_TEAM_ID" =~ '^[A-Z0-9]{10}$' ]]; then
            echo "The APPLE_TEAM_ID repository variable must be a 10-character Apple Team ID." >&2
            exit 1
          fi
          if [[ -z "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo "The SPARKLE_PUBLIC_ED_KEY repository variable is required." >&2
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$(git rev-list -n 1 "$GITHUB_REF_NAME")" ]]; then
            echo "The checked-out commit does not match the release tag." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main || \
             ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Public release tags must point to a commit on main." >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="519-Tech-Intake-Recorder-$VERSION.dmg"
          DMG_PATH="downloads/$GITHUB_REF_NAME/$DMG_NAME"
          APPCAST_PATH="latest/appcast.xml"

          [[ -f "$DMG_PATH" && ! -L "$DMG_PATH" ]]
          [[ -f "$APPCAST_PATH" && ! -L "$APPCAST_PATH" ]]
          [[ "$(git ls-tree HEAD -- "$DMG_PATH" | awk '{print $1}')" == "100644" ]]
          [[ "$(git ls-tree HEAD -- "$APPCAST_PATH" | awk '{print $1}')" == "100644" ]]

          tracked_dmg_count="$(git ls-tree -r --name-only HEAD -- "downloads/$GITHUB_REF_NAME" | wc -l | tr -d ' ')"
          tracked_appcast_count="$(git ls-tree -r --name-only HEAD -- latest | wc -l | tr -d ' ')"
          [[ "$tracked_dmg_count" == "1" ]]
          [[ "$tracked_appcast_count" == "1" ]]

          changed_paths="$(git diff-tree --no-commit-id --name-only -r HEAD | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n%s\n' "$DMG_PATH" "$APPCAST_PATH" | LC_ALL=C sort)"
          if [[ "$changed_paths" != "$expected_paths" ]]; then
            echo "The tagged commit must change only the expected DMG and appcast paths." >&2
            diff -u <(printf '%s\n' "$expected_paths") <(printf '%s\n' "$changed_paths") || true
            exit 1
          fi

          dmg_count="$(find "downloads/$GITHUB_REF_NAME" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          appcast_count="$(find latest -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          [[ "$dmg_count" == "1" ]]
          [[ "$appcast_count" == "1" ]]
          [[ -z "$(find "downloads/$GITHUB_REF_NAME" latest -type l -print -quit)" ]]

          IFS=. read -r current_major current_minor current_patch <<< "$VERSION"
          while IFS= read -r release_tag; do
            [[ "$release_tag" == "$GITHUB_REF_NAME" ]] && continue
            [[ "$release_tag" =~ $SEMVER_PATTERN ]] || continue
            release_version="${release_tag#v}"
            IFS=. read -r release_major release_minor release_patch <<< "$release_version"
            if (( release_major > current_major ||
                  (release_major == current_major && release_minor > current_minor) ||
                  (release_major == current_major && release_minor == current_minor && release_patch >= current_patch) )); then
              echo "$GITHUB_REF_NAME is not newer than published release $release_tag." >&2
              exit 1
            fi
          done < <(
            gh api --paginate "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          )

          {
            echo "version=$VERSION"
            echo "dmg_name=$DMG_NAME"
            echo "dmg_path=$DMG_PATH"
            echo "appcast_path=$APPCAST_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Verify notarized app, DMG, and Sparkle signatures
        id: artifacts
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          DMG_NAME: ${{ steps.metadata.outputs.dmg_name }}
          DMG_PATH: ${{ steps.metadata.outputs.dmg_path }}
          APPCAST_PATH: ${{ steps.metadata.outputs.appcast_path }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          MOUNT_DIR="$(mktemp -d "$RUNNER_TEMP/intake-public-release.XXXXXX")"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" -quiet 2>/dev/null || true
            rm -rf "$MOUNT_DIR"
          }
          trap cleanup EXIT

          dmg_size="$(stat -f %z "$DMG_PATH")"
          appcast_size="$(stat -f %z "$APPCAST_PATH")"
          (( dmg_size > 0 && dmg_size <= 250000000 ))
          (( appcast_size > 0 && appcast_size <= 2000000 ))

          hdiutil verify "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$MOUNT_DIR" "$DMG_PATH"

          APP="$MOUNT_DIR/519 Tech Intake Recorder.app"
          PLIST="$APP/Contents/Info.plist"
          EXECUTABLE="$APP/Contents/MacOS/IntakeRecorder"
          [[ -d "$APP" && ! -L "$APP" ]]
          [[ -f "$PLIST" && ! -L "$PLIST" ]]
          [[ -f "$EXECUTABLE" && ! -L "$EXECUTABLE" ]]
          [[ "$(find "$MOUNT_DIR" -mindepth 1 -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" == "1" ]]
          [[ -L "$MOUNT_DIR/Applications" ]]
          [[ "$(readlink "$MOUNT_DIR/Applications")" == "/Applications" ]]

          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          lipo -verify_arch arm64 "$EXECUTABLE"
          plutil -lint "$PLIST"

          [[ "$(plutil -extract CFBundleIdentifier raw -o - "$PLIST")" == "ca.519tech.IntakeRecorder" ]]
          [[ "$(plutil -extract CFBundleShortVersionString raw -o - "$PLIST")" == "$VERSION" ]]
          APP_BUILD="$(plutil -extract CFBundleVersion raw -o - "$PLIST")"
          [[ "$APP_BUILD" =~ '^[1-9][0-9]*$' ]]
          [[ "$(plutil -extract LSMinimumSystemVersion raw -o - "$PLIST")" == "14.0" ]]
          [[ "$(plutil -extract SUFeedURL raw -o - "$PLIST")" == "https://github.com/519tech/519-Tech-Intake-Recorder-Releases/releases/latest/download/appcast.xml" ]]
          [[ "$(plutil -extract SUPublicEDKey raw -o - "$PLIST")" == "$SPARKLE_PUBLIC_ED_KEY" ]]
          [[ "$(plutil -extract SURequireSignedFeed raw -o - "$PLIST")" == "true" ]]
          [[ "$(plutil -extract SUVerifyUpdateBeforeExtraction raw -o - "$PLIST")" == "true" ]]

          SIGNATURE_INFO="$RUNNER_TEMP/app-signature.txt"
          codesign -dv --verbose=4 "$APP" 2> "$SIGNATURE_INFO"
          [[ "$(sed -n 's/^TeamIdentifier=//p' "$SIGNATURE_INFO")" == "$APPLE_TEAM_ID" ]]
          grep -Eq '^Authority=Developer ID Application: .+ \([A-Z0-9]{10}\)$' "$SIGNATURE_INFO"
          grep -Fq "($APPLE_TEAM_ID)" "$SIGNATURE_INFO"
          grep -Eq '^CodeDirectory .*flags=.*runtime' "$SIGNATURE_INFO"

          ENTITLEMENTS="$RUNNER_TEMP/app-entitlements.plist"
          codesign --display --entitlements - --xml "$APP" > "$ENTITLEMENTS" 2>/dev/null
          plutil -lint "$ENTITLEMENTS"
          [[ "$(plutil -extract com.apple.security.device.audio-input raw -o - "$ENTITLEMENTS")" == "true" ]]
          [[ "$(plutil -extract com.apple.application-identifier raw -o - "$ENTITLEMENTS")" == "$APPLE_TEAM_ID.ca.519tech.IntakeRecorder" ]]
          [[ "$(plutil -extract com.apple.developer.team-identifier raw -o - "$ENTITLEMENTS")" == "$APPLE_TEAM_ID" ]]
          [[ "$(plutil -extract com.apple.security.get-task-allow raw -o - "$ENTITLEMENTS" 2>/dev/null || true)" != "true" ]]
          [[ "$(plutil -extract com.apple.security.cs.disable-library-validation raw -o - "$ENTITLEMENTS" 2>/dev/null || true)" != "true" ]]

          PROFILE="$APP/Contents/embedded.provisionprofile"
          PROFILE_PLIST="$RUNNER_TEMP/embedded-provisioning-profile.plist"
          [[ -f "$PROFILE" && ! -L "$PROFILE" ]]
          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"
          plutil -lint "$PROFILE_PLIST"
          [[ "$(plutil -extract ProvisionsAllDevices raw -o - "$PROFILE_PLIST")" == "true" ]]
          [[ "$(plutil -extract TeamIdentifier.0 raw -o - "$PROFILE_PLIST")" == "$APPLE_TEAM_ID" ]]
          if PROFILE_APP_ID="$(plutil -extract 'Entitlements.com\.apple\.application-identifier' raw -o - "$PROFILE_PLIST" 2>/dev/null)"; then
            :
          else
            PROFILE_APP_ID="$(plutil -extract Entitlements.application-identifier raw -o - "$PROFILE_PLIST")"
          fi
          [[ "$PROFILE_APP_ID" == "$APPLE_TEAM_ID.ca.519tech.IntakeRecorder" ]]

          KEYCHAIN_GROUP="$(plutil -extract 'keychain-access-groups.0' raw -o - "$ENTITLEMENTS" 2>/dev/null || true)"
          if [[ -n "$KEYCHAIN_GROUP" ]]; then
            [[ "$KEYCHAIN_GROUP" == "$APPLE_TEAM_ID.ca.519tech.IntakeRecorder" ]]
            PROFILE_KEYCHAIN_GROUP="$(plutil -extract 'Entitlements.keychain-access-groups.0' raw -o - "$PROFILE_PLIST")"
            [[ "$PROFILE_KEYCHAIN_GROUP" == "$KEYCHAIN_GROUP" || "$PROFILE_KEYCHAIN_GROUP" == "$APPLE_TEAM_ID.*" ]]
          fi

          SPARKLE_CURRENT="$APP/Contents/Frameworks/Sparkle.framework/Versions/Current"
          HELPERS=(
            "$SPARKLE_CURRENT/XPCServices/Installer.xpc"
            "$SPARKLE_CURRENT/XPCServices/Downloader.xpc"
            "$SPARKLE_CURRENT/Autoupdate"
            "$SPARKLE_CURRENT/Updater.app"
          )
          for helper in "${HELPERS[@]}"; do
            [[ -e "$helper" ]]
            helper_entitlements="$(mktemp "$RUNNER_TEMP/helper-entitlements.XXXXXX")"
            codesign --display --entitlements - --xml "$helper" > "$helper_entitlements" 2>/dev/null
            [[ "$(plutil -extract com.apple.security.device.audio-input raw -o - "$helper_entitlements" 2>/dev/null || true)" != "true" ]]
            [[ "$(plutil -extract com.apple.security.get-task-allow raw -o - "$helper_entitlements" 2>/dev/null || true)" != "true" ]]
            rm -f "$helper_entitlements"
          done

          EXPECTED_URL="https://github.com/519tech/519-Tech-Intake-Recorder-Releases/releases/download/v$VERSION/$DMG_NAME"
          swift scripts/verify_sparkle_release.swift \
            "$APPCAST_PATH" \
            "$DMG_PATH" \
            "$SPARKLE_PUBLIC_ED_KEY" \
            "$VERSION" \
            "$APP_BUILD" \
            "$EXPECTED_URL" \
            "14.0"

          hdiutil detach "$MOUNT_DIR" -quiet
          rm -rf "$MOUNT_DIR"
          trap - EXIT

          STAGING_DIR="$RUNNER_TEMP/verified-release"
          install -d -m 700 "$STAGING_DIR"
          cp "$DMG_PATH" "$STAGING_DIR/$DMG_NAME"
          cp "$APPCAST_PATH" "$STAGING_DIR/appcast.xml"

          DMG_SHA256="$(shasum -a 256 "$STAGING_DIR/$DMG_NAME" | awk '{print $1}')"
          APPCAST_SHA256="$(shasum -a 256 "$STAGING_DIR/appcast.xml" | awk '{print $1}')"
          {
            echo "dmg_sha256=$DMG_SHA256"
            echo "appcast_sha256=$APPCAST_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-${{ github.ref_name }}
          path: ${{ runner.temp }}/verified-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ github.ref_name }}
          path: release

      - name: Verify artifact handoff
        env:
          DMG_NAME: ${{ needs.verify.outputs.dmg_name }}
          EXPECTED_DMG_SHA256: ${{ needs.verify.outputs.dmg_sha256 }}
          EXPECTED_APPCAST_SHA256: ${{ needs.verify.outputs.appcast_sha256 }}
        run: |
          [[ -f "release/$DMG_NAME" && ! -L "release/$DMG_NAME" ]]
          [[ -f release/appcast.xml && ! -L release/appcast.xml ]]
          [[ "$(find release -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" == "2" ]]
          [[ -z "$(find release -type l -print -quit)" ]]
          [[ "$(shasum -a 256 "release/$DMG_NAME" | awk '{print $1}')" == "$EXPECTED_DMG_SHA256" ]]
          [[ "$(shasum -a 256 release/appcast.xml | awk '{print $1}')" == "$EXPECTED_APPCAST_SHA256" ]]

      - name: Create, verify, and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          DMG_NAME: ${{ needs.verify.outputs.dmg_name }}
          EXPECTED_DMG_SHA256: ${{ needs.verify.outputs.dmg_sha256 }}
          EXPECTED_APPCAST_SHA256: ${{ needs.verify.outputs.appcast_sha256 }}
        run: |
          RELEASE_STATE="$RUNNER_TEMP/release-state.json"
          if gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,tagName > "$RELEASE_STATE" 2>/dev/null; then
            [[ "$(jq -r .tagName "$RELEASE_STATE")" == "$GITHUB_REF_NAME" ]]
            if [[ "$(jq -r .isDraft "$RELEASE_STATE")" != "true" ]]; then
              echo "A published release already exists for $GITHUB_REF_NAME; refusing to mutate it." >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "519 Tech Intake Recorder $VERSION" \
              --draft \
              --prerelease=false
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "519 Tech Intake Recorder $VERSION" \
              --generate-notes \
              --verify-tag \
              --draft
          fi

          gh release upload "$GITHUB_REF_NAME" \
            "release/$DMG_NAME" \
            release/appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          SERVER_DIR="$(mktemp -d "$RUNNER_TEMP/server-release.XXXXXX")"
          PUBLISHED_DIR="$(mktemp -d "$RUNNER_TEMP/published-release.XXXXXX")"
          trap 'rm -rf "$SERVER_DIR" "$PUBLISHED_DIR"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$SERVER_DIR" \
            --pattern "$DMG_NAME" \
            --pattern appcast.xml
          [[ "$(find "$SERVER_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" == "2" ]]
          [[ "$(shasum -a 256 "$SERVER_DIR/$DMG_NAME" | awk '{print $1}')" == "$EXPECTED_DMG_SHA256" ]]
          [[ "$(shasum -a 256 "$SERVER_DIR/appcast.xml" | awk '{print $1}')" == "$EXPECTED_APPCAST_SHA256" ]]

          DRAFT_ASSETS="$RUNNER_TEMP/draft-assets.json"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,isPrerelease,tagName > "$DRAFT_ASSETS"
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            --arg dmg "$DMG_NAME" \
            '.tagName == $tag and .isDraft == true and .isPrerelease == false and
             (.assets | length) == 2 and
             ([.assets[].name] | sort) == ([$dmg, "appcast.xml"] | sort)' \
            "$DRAFT_ASSETS" > /dev/null

          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft=false \
            --prerelease=false \
            --latest

          PUBLISHED_STATE="$RUNNER_TEMP/published-state.json"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,isPrerelease,tagName > "$PUBLISHED_STATE"
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            --arg dmg "$DMG_NAME" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false and
             (.assets | length) == 2 and
             ([.assets[].name] | sort) == ([$dmg, "appcast.xml"] | sort)' \
            "$PUBLISHED_STATE" > /dev/null

          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$PUBLISHED_DIR" \
            --pattern "$DMG_NAME" \
            --pattern appcast.xml
          [[ "$(find "$PUBLISHED_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" == "2" ]]
          [[ "$(shasum -a 256 "$PUBLISHED_DIR/$DMG_NAME" | awk '{print $1}')" == "$EXPECTED_DMG_SHA256" ]]
          [[ "$(shasum -a 256 "$PUBLISHED_DIR/appcast.xml" | awk '{print $1}')" == "$EXPECTED_APPCAST_SHA256" ]]
          [[ "$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$GITHUB_REF_NAME" ]]
